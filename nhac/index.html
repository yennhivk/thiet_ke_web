<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc - Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .music-header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #fff;
            padding: 50px 0;
            text-align: center;
            border-bottom: 5px solid #ff9a9e;
        }
        .playlist-item {
            cursor: pointer;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }
        .playlist-item:hover, .playlist-item.active {
            background-color: #e9ecef;
            border-left-color: #ff9a9e;
        }
        .ratio-container {
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <!-- Icon Home liên tiếp về trang chủ chính -->
            <a class="navbar-brand text-light" href="../index.html" title="Về trang chủ chính">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16">
                  <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
                </svg>
            </a>
            <a class="navbar-brand fw-bold ms-2" href="index.html">Kho Nhạc Giải Trí</a>
        </div>
    </nav>

    <!-- Header nhạc -->
    <div class="music-header mb-5">
        <div class="container">
            <i class="fa-solid fa-headphones-simple d-block mb-3" style="font-size: 3.5rem;"></i>
            <h1 class="fw-bold text-uppercase">Danh sách Video Âm Nhạc</h1>
            <p class="fs-5 opacity-75 mb-0">Thư giãn và tận hưởng những giai điệu yêu thích</p>
        </div>
    </div>

    <!-- Nội dung chính -->
    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- Cột trái: PlayList -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white fw-bold py-3 fs-5">
                        <i class="fa-solid fa-list text-danger me-2"></i> Chọn bài hát
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item playlist-item py-3 active" onclick="changeVideo('https://www.youtube.com/embed/K4DyBUG242c', this)">
                            <div class="d-flex align-items-center">
                                <i class="fa-brands fa-youtube text-danger fs-4 me-3"></i> 
                                <span class="fw-semibold">Video nhạc 1 (K4DyBUG242c)</span>
                            </div>
                        </li>
                        <li class="list-group-item playlist-item py-3" onclick="changeVideo('https://www.youtube.com/embed/bM7SZ5SBzyY', this)">
                            <div class="d-flex align-items-center">
                                <i class="fa-brands fa-youtube text-danger fs-4 me-3"></i> 
                                <span class="fw-semibold">Video nhạc 2 (bM7SZ5SBzyY)</span>
                            </div>
                        </li>
                        <li class="list-group-item playlist-item py-3" onclick="changeVideo('https://www.youtube.com/embed/AOeY-nDp7hI', this)">
                            <div class="d-flex align-items-center">
                                <i class="fa-brands fa-youtube text-danger fs-4 me-3"></i> 
                                <span class="fw-semibold">Video nhạc 3 (AOeY-nDp7hI)</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Cột phải: Video Player -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 h-100 bg-white">
                    <h4 class="fw-bold mb-4 text-center text-dark"><i class="fa-solid fa-play me-2"></i> Đang Phát</h4>
                    <div class="ratio-container">
                        <!-- Tỉ lệ khung hình 16:9 của Bootstrap -->
                        <div class="ratio ratio-16x9">
                            <iframe id="videoPlayer" src="https://www.youtube.com/embed/K4DyBUG242c" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 bg-white border-top mt-auto">
        <h5 class="fw-bold mb-3">ĐẠI HỌC TRÀ VINH</h5>
        <p class="text-muted mb-1"><i class="fa-solid fa-location-dot me-2"></i> 126 Nguyễn Thiện Thành, Phường 5, TP. Trà Vinh</p>
        <p class="text-muted mb-0"><i class="fa-solid fa-phone me-2"></i> 0294 383 2222</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function changeVideo(url, element) {
            // Thay đổi src của Iframe
            document.getElementById('videoPlayer').src = url;
            
            // Xóa trạng thái đang chọn của các li cũ
            const items = document.querySelectorAll('.playlist-item');
            items.forEach(i => i.classList.remove('active'));
            
            // Đánh dấu thẻ li hiện tại vừa click
            element.classList.add('active');
        }
    </script>
</body>
</html>
